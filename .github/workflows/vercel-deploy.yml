name: Deploy to Client Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Git metadata hata do taake Vercel commit author check na kare
      - name: Strip git metadata
        run: rm -rf .git

      # Project ka naam se link, is liye Org ID / Project ID dhoondhne ki zaroorat nahi
      - name: Link client Vercel project
        run: vercel link --yes --project "${{ secrets.VERCEL_PROJECT_NAME }}" --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel project settings & env vars
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
