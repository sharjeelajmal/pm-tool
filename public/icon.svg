<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1B3D"/><stop offset="1" stop-color="#050A1A"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1D4ED8"/><stop offset=".5" stop-color="#3B82F6"/><stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2563EB" stop-opacity=".45"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/><stop offset="1" stop-color="#0B1633"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".5" cy=".0" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="sd" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="cs" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#60A5FA" flood-opacity=".6"/></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#sheen)"/>
  <g transform="translate(0.0 0.0) scale(1.0)">
    
      <circle cx="256" cy="256" r="235" fill="url(#halo)"/>
      <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="44" stroke-linecap="round"
        stroke-dasharray="735.1 942.4777960769379" transform="rotate(-90 256 256)" filter="url(#bl)" opacity=".75"/>
    <circle cx="256" cy="256" r="150" fill="none" stroke="#3B82F6" stroke-opacity=".10" stroke-width="44"/>
    <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="44" stroke-linecap="round"
      stroke-dasharray="735.1 942.4777960769379" transform="rotate(-90 256 256)"/>
    <circle cx="256" cy="256" r="104" fill="url(#core)" filter="url(#sd)"/>
    <circle cx="256" cy="256" r="104" fill="none" stroke="#93C5FD" stroke-opacity=".18" stroke-width="2"/>
    <path d="M208 258 L242 292 L306 222" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" filter="url(#cs)"/>
